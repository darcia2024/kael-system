<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tidak ada koneksi</title>
    <!--
      Disajikan service worker (public/sw.js) saat perpindahan halaman gagal
      karena tidak ada jaringan. Harus berdiri sendiri: tanpa font, gambar,
      atau skrip dari luar, karena justru jaringannya yang sedang putus.
      Teksnya netral — halaman ini juga bisa tampil di halaman pelanggan toko.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6fc;
        color: #232331;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 340px; text-align: center; }
      .ikon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #232331;
        display: grid;
        place-items: center;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #5c5c70; margin: 0 0 20px; }
      button {
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        padding: 12px 22px;
        border-radius: 12px;
        border: 2px solid #232331;
        background: #d9ff57;
        color: #232331;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ikon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d9ff57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.43" />
          <path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </div>
      <h1>Tidak ada koneksi internet</h1>
      <p>
        Halaman ini butuh internet untuk menampilkan data terbaru. Periksa Wi-Fi atau data
        seluler — halamannya dimuat ulang sendiri begitu koneksi kembali.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
